plugins {
    id "com.android.application"
}

android {
    namespace "org.demo.ciba"
    compileSdk 35
    defaultConfig {
        applicationId "org.demo.ciba"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
