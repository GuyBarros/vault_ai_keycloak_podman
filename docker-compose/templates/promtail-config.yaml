server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Docker socket discovery ─────────────────────────────────────────────────
  # Promtail reads logs directly from the Docker daemon via the socket.
  # No json-file log driver needed — works with journald or any driver.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["ai-agent", "user-mcp", "token-exchange"]

    relabel_configs:
      # Use the container name (strip leading /) as the "container" label
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container

      # Keep only the three audit services
      - source_labels: [container]
        regex: ai-agent|user-mcp|token-exchange
        action: keep

    pipeline_stages:
      # Each line is already the app's JSON log output
      - json:
          expressions:
            event:              event
            level:              level
            preferred_username: preferred_username
            agent_id:           agent_id
            auth_scope:         auth_scope
            tool:               tool
            required_scopes:    required_scopes
            db_username:        db_username
            db_creds_path:      db_creds_path
            lease_id:           lease_id
            request_id:         request_id

      # Promote low-cardinality fields as Loki index labels
      - labels:
          event:
          level:
