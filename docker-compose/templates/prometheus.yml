global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

scrape_configs:

  # ── Prometheus self-monitoring ──────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Vault — full telemetry via sys/metrics ──────────────────────────────────
  - job_name: vault
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    bearer_token: root
    static_configs:
      - targets: ["vault:8200"]
    relabel_configs:
      - target_label: service
        replacement: vault

  # ── LiteLLM — proxy usage and latency metrics ───────────────────────────────
  - job_name: litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: ibm123
    static_configs:
      - targets: ["litellm:4000"]
    relabel_configs:
      - target_label: service
        replacement: litellm

  # ── cAdvisor — per-container resource metrics ───────────────────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    relabel_configs:
      - target_label: service
        replacement: cadvisor

  # ── Postgres exporter ───────────────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      - target_label: service
        replacement: postgres
