agent {
  data_dir     = "/tmp/spire-data/agent"
  log_level    = "INFO"
  server_address = "spire-server"
  server_port    = "8081"
  socket_path    = "/tmp/spire-agent/api.sock"
  trust_domain   = "example.org"

  # In this Docker Compose demo the agent attests with a join token written
  # by spire-setup.  The token file is read once at start and then ignored.
  insecure_bootstrap = true
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {
      # The token is injected via the JOIN_TOKEN env variable set in spire-setup.sh
    }
  }

  KeyManager "memory" {
    plugin_data {}
  }

  WorkloadAttestor "unix" {
    plugin_data {
      discover_workload_dir = true
    }
  }
}
