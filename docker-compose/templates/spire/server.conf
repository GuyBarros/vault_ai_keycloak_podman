server {
  bind_address = "0.0.0.0"
  bind_port    = "8081"
  trust_domain = "example.org"
  data_dir     = "/opt/spire/data/server"
  log_level    = "INFO"

  # Expose the bundle/JWKS endpoint on port 8082.
  # Uses the default https_spiffe profile (SPIRE self-signed cert).
  # Vault is configured with insecure_tls=true to skip cert verification.
  federation {
    bundle_endpoint {
      address = "0.0.0.0"
      port    = 8082
      profile "https_spiffe" {
        endpoint_spiffe_id = "spiffe://example.org/spire/server"
      }
    }
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type        = "sqlite3"
      connection_string    = "/opt/spire/data/server/datastore.sqlite3"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "memory" {
    plugin_data {}
  }
}
